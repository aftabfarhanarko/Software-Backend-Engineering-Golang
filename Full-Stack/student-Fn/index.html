<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-gradient-to-br from-slate-50 via-indigo-50/40 to-slate-100 text-slate-800 min-h-screen py-10 px-4 sm:px-6">

  <div class="max-w-2xl mx-auto">
    <!-- Header Banner -->
    <header class="bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-slate-100 overflow-hidden mb-8">
      <div class="bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 px-6 sm:px-8 py-7 text-white relative">
        <div class="flex items-center gap-4">
          <div
            class="w-14 h-14 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-2xl shadow-inner text-white shrink-0">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Student Registration</h1>
            <p class="text-indigo-100 text-xs sm:text-sm mt-0.5">Please provide your personal and contact details.</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Registration Form -->
    <main class="bg-white rounded-3xl shadow-xl shadow-indigo-100/50 border border-slate-100 p-6 sm:p-8">
      <form id="studentRegistrationForm" novalidate class="space-y-8">

        <!-- 1. Personal Information -->
        <section aria-labelledby="section-personal">
          <div class="flex items-center gap-3 border-b border-slate-100 pb-3 mb-5">
            <span
              class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-sm font-bold shadow-sm">
              <i class="fa-regular fa-user"></i>
            </span>
            <div>
              <h2 id="section-personal" class="text-base font-bold text-slate-900">1. Personal Information</h2>
              <p class="text-xs text-slate-500">Basic identification details</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <!-- First Name -->
            <div>
              <label for="firstName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                First Name <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-regular fa-id-badge"></i>
                </span>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name" required
                  placeholder="e.g. John"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>

            <!-- Last Name -->
            <div>
              <label for="lastName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Last Name <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-regular fa-id-badge"></i>
                </span>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name" required
                  placeholder="e.g. Doe"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>

            <!-- Date of Birth -->
            <div>
              <label for="dob" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Date of Birth <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-regular fa-calendar-days"></i>
                </span>
                <input type="date" id="dob" name="dob" autocomplete="bday" required
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>

            <!-- Gender -->
            <div>
              <fieldset>
                <legend class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                  Gender <span class="text-rose-500">*</span>
                </legend>
                <div class="grid grid-cols-3 gap-2">
                  <label
                    class="flex items-center justify-center gap-1.5 p-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs font-medium cursor-pointer hover:border-brand-300 has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-700 transition">
                    <input type="radio" name="gender" value="Male" class="text-brand-600 focus:ring-brand-500" required>
                    <span>Male</span>
                  </label>
                  <label
                    class="flex items-center justify-center gap-1.5 p-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs font-medium cursor-pointer hover:border-brand-300 has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-700 transition">
                    <input type="radio" name="gender" value="Female" class="text-brand-600 focus:ring-brand-500">
                    <span>Female</span>
                  </label>
                  <label
                    class="flex items-center justify-center gap-1.5 p-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-xs font-medium cursor-pointer hover:border-brand-300 has-[:checked]:border-brand-600 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-700 transition">
                    <input type="radio" name="gender" value="Other" class="text-brand-600 focus:ring-brand-500">
                    <span>Other</span>
                  </label>
                </div>
              </fieldset>
              <p id="gender-error" class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>
          </div>
        </section>

        <!-- 2. Contact & Address Details -->
        <section aria-labelledby="section-contact">
          <div class="flex items-center gap-3 border-b border-slate-100 pb-3 mb-5">
            <span
              class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center text-sm font-bold shadow-sm">
              <i class="fa-solid fa-phone-volume"></i>
            </span>
            <div>
              <h2 id="section-contact" class="text-base font-bold text-slate-900">2. Contact & Address Details</h2>
              <p class="text-xs text-slate-500">How we can get in touch with you</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <!-- Email -->
            <div>
              <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Email Address <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-regular fa-envelope"></i>
                </span>
                <input type="email" id="email" name="email" autocomplete="email" required
                  placeholder="student@example.com"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>

            <!-- Phone -->
            <div>
              <label for="phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Phone Number <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-solid fa-phone"></i>
                </span>
                <input type="tel" id="phone" name="phone" autocomplete="tel" required placeholder="+1 234 567 8900"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition">
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>

            <!-- Address -->
            <div class="sm:col-span-2">
              <label for="address" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Address <span class="text-rose-500">*</span>
              </label>
              <div class="relative">
                <span class="absolute top-3 left-3.5 pointer-events-none text-slate-400 text-sm">
                  <i class="fa-solid fa-location-dot"></i>
                </span>
                <textarea id="address" name="address" rows="3" required placeholder="House/Street, City, Country"
                  class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition"></textarea>
              </div>
              <p class="error-msg hidden text-xs text-rose-500 mt-1 font-medium"></p>
            </div>
          </div>
        </section>

        <!-- Actions -->
        <div class="pt-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-end gap-3">
          <button type="reset" id="resetBtn"
            class="w-full sm:w-auto px-6 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-semibold text-sm transition">
            Reset
          </button>
          <button type="submit" id="submitBtn"
            class="w-full sm:w-auto px-7 py-2.5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-semibold text-sm shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            Submit
          </button>
        </div>

      </form>
    </main>
  </div>

  <!-- Success Notification Modal -->
  <div id="successModal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100">
      <div
        class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-check"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-900">Submitted Successfully!</h3>
      <p class="text-xs text-slate-500 mt-1 mb-4">Check browser console (F12) to see logged data.</p>

      <div id="modalSummary"
        class="text-left bg-slate-50 rounded-2xl p-4 text-xs space-y-2 border border-slate-100 mb-5 font-medium text-slate-700">
        <!-- Injected via JS -->
      </div>

      <button type="button" id="closeModalBtn"
        class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm transition shadow-md shadow-brand-500/20">
        Done
      </button>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('studentRegistrationForm');
      const successModal = document.getElementById('successModal');
      const modalSummary = document.getElementById('modalSummary');
      const closeModalBtn = document.getElementById('closeModalBtn');

      // Clear errors on input
      form.querySelectorAll('input, textarea').forEach(element => {
        element.addEventListener('input', () => {
          clearElementError(element);
        });
      });

      function clearElementError(element) {
        element.classList.remove('border-rose-400', 'ring-2', 'ring-rose-200');
        const parent = element.closest('div');
        const errorMsg = parent ? parent.querySelector('.error-msg') : null;
        if (errorMsg) {
          errorMsg.classList.add('hidden');
          errorMsg.textContent = '';
        }
      }

      function showElementError(element, message) {
        element.classList.add('border-rose-400', 'ring-2', 'ring-rose-200');
        const parent = element.closest('div');
        const errorMsg = parent ? parent.querySelector('.error-msg') : null;
        if (errorMsg) {
          errorMsg.classList.remove('hidden');
          errorMsg.textContent = message;
        }
      }

      // Form Submit & Validation
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        let isValid = true;

        const fields = [
          { id: 'firstName', msg: 'First name is required' },
          { id: 'lastName', msg: 'Last name is required' },
          { id: 'dob', msg: 'Date of birth is required' },
          { id: 'email', msg: 'Valid email is required', validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
          { id: 'phone', msg: 'Valid phone is required', validate: (v) => v.trim().length >= 7 },
          { id: 'address', msg: 'Address is required' }
        ];

        fields.forEach(field => {
          const input = document.getElementById(field.id);
          if (!input) return;

          const val = input.value.trim();
          if (!val) {
            showElementError(input, field.msg);
            isValid = false;
          } else if (field.validate && !field.validate(val)) {
            showElementError(input, field.msg);
            isValid = false;
          } else {
            clearElementError(input);
          }
        });

        // Gender validation
        const genderChecked = form.querySelector('input[name="gender"]:checked');
        const genderError = document.getElementById('gender-error');
        if (!genderChecked) {
          genderError.textContent = 'Please select a gender.';
          genderError.classList.remove('hidden');
          isValid = false;
        } else {
          genderError.classList.add('hidden');
        }

        if (isValid) {
          const firstName = document.getElementById('firstName').value.trim();
          const lastName = document.getElementById('lastName').value.trim();
          const dob = document.getElementById('dob').value;
          const gender = genderChecked.value;
          const email = document.getElementById('email').value.trim();
          const phone = document.getElementById('phone').value.trim();
          const address = document.getElementById('address').value.trim();

          // Structured simple data
          const studentData = {
            firstName: firstName,
            lastName: lastName,
            fullName: `${firstName} ${lastName}`,
            dateOfBirth: dob,
            gender: gender,
            email: email,
            phone: phone,
            address: address
          };

          const submitBtn = document.getElementById('submitBtn');
          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-60', 'cursor-not-allowed');

          try {
            const response = await fetch('http://localhost:3000/api/students', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(studentData)
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || 'Registration failed.');

          // Console output
          console.group('🎓 Student Registration Data');
          console.log('Student Info:', result);
          console.table(result);
          console.groupEnd();

          const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
          })[character]);

          // Modal summary
          modalSummary.innerHTML = `
            <div class="flex justify-between border-b border-slate-200/60 pb-1.5">
              <span class="text-slate-400">Name:</span>
              <span class="font-semibold text-slate-800">${escapeHtml(studentData.fullName)}</span>
            </div>
            <div class="flex justify-between border-b border-slate-200/60 pb-1.5">
              <span class="text-slate-400">Gender / DOB:</span>
              <span class="text-slate-800">${escapeHtml(studentData.gender)}, ${escapeHtml(studentData.dateOfBirth)}</span>
            </div>
            <div class="flex justify-between border-b border-slate-200/60 pb-1.5">
              <span class="text-slate-400">Email:</span>
              <span class="text-slate-800">${escapeHtml(studentData.email)}</span>
            </div>
            <div class="flex justify-between border-b border-slate-200/60 pb-1.5">
              <span class="text-slate-400">Phone:</span>
              <span class="text-slate-800">${escapeHtml(studentData.phone)}</span>
            </div>
            <div class="flex justify-between">
              <span class="text-slate-400">Address:</span>
              <span class="text-slate-800 truncate max-w-[150px]">${escapeHtml(studentData.address)}</span>
            </div>
          `;

          successModal.classList.remove('hidden');
          } catch (error) {
            alert(error.message || 'Could not connect to the backend. Make sure it is running.');
          } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-60', 'cursor-not-allowed');
          }
        }
      });

      // Close modal
      closeModalBtn.addEventListener('click', () => {
        successModal.classList.add('hidden');
        form.reset();
      });

      // Reset button
      document.getElementById('resetBtn').addEventListener('click', () => {
        setTimeout(() => {
          form.querySelectorAll('.error-msg').forEach(el => el.classList.add('hidden'));
          form.querySelectorAll('input, textarea').forEach(el => {
            el.classList.remove('border-rose-400', 'ring-2', 'ring-rose-200');
          });
        }, 50);
      });
    });
  </script>
</body>

</html>
